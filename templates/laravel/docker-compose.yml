services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-laravel}-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
    networks:
      - devnet

  # untuk Vite / npm run dev. Jalankan dengan: docker compose --profile node up -d
  node:
    image: node:20-alpine
    container_name: ${APP_NAME:-laravel}-node
    profiles: ["node"]
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - devnet

networks:
  devnet:
    external: true
    name: devnet
