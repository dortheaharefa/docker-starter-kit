services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
    container_name: ${APP_NAME:-nodeapp}-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - ./:/app
      # node_modules dipisah agar tidak tertimpa folder dari Windows
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: ${APP_PORT:-3000}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-devdb}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-root}
      # agar perubahan file di Windows terdeteksi container
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run dev"
    networks:
      - devnet

networks:
  devnet:
    external: true
    name: devnet

volumes:
  node_modules:
    name: ${APP_NAME:-nodeapp}-node_modules
